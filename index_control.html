<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>LED 控制面板</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding-top: 50px;
    }
    h1 {
      margin-bottom: 40px;
    }
    button {
      padding: 15px 30px;
      font-size: 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .on {
      background-color: #4CAF50;
      color: white;
    }
    .on:hover {
      background-color: #45a049;
    }
    .off {
      background-color: #f44336;
      color: white;
    }
    .off:hover {
      background-color: #da190b;
    }
    #status {
      margin-top: 30px;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>LED 控制面板</h1>
  <p>设备 ID: <strong>10</strong></p>

  <!-- <button class="on" onclick="sendCommand('led_on')">打开 LED</button>
  <button class="off" onclick="sendCommand('led_off')">关闭 LED</button> -->

  <button id="btn-on" class="on" onclick="sendCommand('led_on')">打开 LED</button>
<button id="btn-off" class="off" onclick="sendCommand('led_off')">关闭 LED</button>


  <p id="status">等待操作...</p>

  <script>


    function sendCommand(cmd) {
      const id = 10;

      fetch('http://127.0.0.1:8999/led/set', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ id, cmd })
      })
      .then(res => res.json())
      .then(data => {
        const status = document.getElementById("status");
        if (data.code === 0) {
          status.textContent = `LED 控制成功：${cmd === "led_on" ? "已打开" : "已关闭"}`;
        } else {
          status.textContent = `错误：${data.msg}`;
        }
      })
      .catch(err => {
        document.getElementById('status').textContent = '请求失败：' + err;
      });
    }
  </script>

</body>
</html>
