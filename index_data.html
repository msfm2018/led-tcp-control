<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #sensors-container {
            display: flex;
            gap: 30px; /* 调整传感器组之间的间距 */
            margin-bottom: 30px;
            flex-wrap: wrap; /* 允许换行 */
            justify-content: center;
        }
        .sensor-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .sensor-group h3 {
            margin-top: 0;
            color: #333;
        }

        /* 温度计样式 - 保持和之前类似 */
        .thermometer-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 30px; /* 与湿度计的间距 */
        }
        .thermometer-id {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: red;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.9em;
            z-index: 2;
        }
        .thermometer {
            width: 60px;
            height: 200px;
            background-color: #eee;
            border: 1px solid #ccc;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            margin-bottom: 5px; /* 温度计与温度值之间的间距 */
        }
        .thermometer-bulb {
            width: 70px;
            height: 70px;
            background-color: #eee;
            border: 1px solid #ccc;
            border-radius: 50%;
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }
        .thermometer-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: red;
            transition: height 0.5s ease-out, background-color 0.5s ease-out;
            z-index: 0;
        }
        .thermometer-value {
            font-weight: bold;
            color: #333;
            margin-top: 5px; /* 调整温度值位置 */
        }
        .thermometer-scale {
            position: absolute;
            left: 0;
            right: 0;
            top: 10px;
            bottom: 10px;
            display: flex;
            flex-direction: column-reverse;
            justify-content: space-between;
            padding: 0 5px;
            box-sizing: border-box;
            z-index: 1;
        }
        .scale-mark {
            height: 1px;
            background-color: #555;
            width: 100%;
        }
        .scale-mark.long {
            width: 100%;
            height: 2px;
        }
        .scale-label {
            position: absolute;
            left: -35px;
            font-size: 0.7em;
            color: #555;
            white-space: nowrap;
        }

        /* 湿度计样式 */
        .humidity-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px; /* 与温度计的间距 */
        }
        .humidity-label {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        .humidity-bar-container {
            width: 100px; /* 湿度条宽度 */
            height: 20px; /* 湿度条高度 */
            background-color: #eee;
            border: 1px solid #ccc;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }
        .humidity-bar-fill {
            height: 100%;
            background-color: #2196F3; /* 蓝色填充 */
            transition: width 0.5s ease-out;
        }
        .humidity-value {
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div id="sensors-container">
    </div>

<table id="tbl" border="1">

</table>

<script>
async function refresh() {
    const res = await fetch("http://127.0.0.1:8999/latest");
    const list = await res.json(); // [{id,temperature,humidity}, ...]

    const tbody = document.getElementById("tbl");
     tbody.innerHTML = "<tr><th>家庭室内温湿度</th></tr>";

    const sensorsContainer = document.getElementById("sensors-container");
    sensorsContainer.innerHTML = ''; // 清空之前的传感器组

    const minTemp = -20; // 温度计的最低温度
    const maxTemp = 60;  // 温度计的最高温度
    const tempRange = maxTemp - minTemp;

    for (const d of list) {
        // 创建每个设备的容器 (包含温度计和湿度计)
        const sensorGroup = document.createElement('div');
        sensorGroup.className = 'sensor-group';
        sensorsContainer.appendChild(sensorGroup);

        const groupTitle = document.createElement('h3');
        groupTitle.textContent = `设备 ID: ${d.id}`;
        sensorGroup.appendChild(groupTitle);

        // --- 温度计部分 ---
        const thermometerWrapper = document.createElement('div');
        thermometerWrapper.className = 'thermometer-wrapper';
        sensorGroup.appendChild(thermometerWrapper);

        // 创建ID标签 (如果需要每个温度计上仍然有小红点ID)
        // const idLabel = document.createElement('div');
        // idLabel.className = 'thermometer-id';
        // idLabel.textContent = d.id;
        // thermometerWrapper.appendChild(idLabel);

        const thermometer = document.createElement('div');
        thermometer.className = 'thermometer';
        thermometerWrapper.appendChild(thermometer);

        const bulb = document.createElement('div');
        bulb.className = 'thermometer-bulb';
        thermometer.appendChild(bulb);

        const fill = document.createElement('div');
        fill.className = 'thermometer-fill';
        thermometer.appendChild(fill);

        const valueDisplayTemp = document.createElement('div');
        valueDisplayTemp.className = 'thermometer-value';
        thermometerWrapper.appendChild(valueDisplayTemp);

        // 创建刻度线 (直接添加到温度计 div 内，更合理)
        const scale = document.createElement('div');
        scale.className = 'thermometer-scale';
        thermometer.appendChild(scale);

        // 添加刻度线和标签
        for (let t = minTemp; t <= maxTemp; t += 10) {
            const mark = document.createElement('div');
            mark.className = 'scale-mark long';
            scale.appendChild(mark);

            const label = document.createElement('span');
            label.className = 'scale-label';
            label.textContent = `${t.toFixed(0)}°C`;
            const percent = (t - minTemp) / tempRange;
            label.style.bottom = `calc(${percent * 100}% - 8px)`;
            scale.appendChild(label);
        }
        for (let t = minTemp; t <= maxTemp; t += 5) {
            if (t % 10 !== 0) {
                const mark = document.createElement('div');
                mark.className = 'scale-mark';
                const percent = (t - minTemp) / tempRange;
                mark.style.position = 'absolute';
                mark.style.bottom = `calc(${percent * 100}% - 1px)`;
                mark.style.width = '70%';
                mark.style.left = '15%';
                scale.appendChild(mark);
            }
        }

        // 更新温度计显示
        // const temperature = d.temperature;
        const temperature = parseFloat(d.temperature);
        const fillHeightPercent = ((temperature - minTemp) / tempRange) * 100;
        fill.style.height = `${Math.max(0, Math.min(100, fillHeightPercent))}%`;

        let fillColor, bulbColor;
        if (temperature >= 40) {
            fillColor = '#E74C3C'; // 红色
            bulbColor = '#E74C3C';
        } else if (temperature >= 30) { // 增加一个高温橙色区间
            fillColor = '#E67E22'; // 橙色
            bulbColor = '#E67E22';
        } else if (temperature >= 15) {
            fillColor = '#F1C40F'; // 黄色
            bulbColor = '#F1C40F';
        } else if (temperature >= 0) {
            fillColor = '#2ECC71'; // 绿色
            bulbColor = '#2ECC71';
        } else {
            fillColor = '#3498DB'; // 蓝色 (低温)
            bulbColor = '#3498DB';
        }
        fill.style.backgroundColor = fillColor;
        bulb.style.backgroundColor = bulbColor;
        valueDisplayTemp.textContent = `${temperature.toFixed(1)}°C`;


        // --- 湿度计部分 ---
        const humidityWrapper = document.createElement('div');
        humidityWrapper.className = 'humidity-wrapper';
        sensorGroup.appendChild(humidityWrapper);

        const humidityLabel = document.createElement('div');
        humidityLabel.className = 'humidity-label';
        humidityLabel.textContent = '湿度';
        humidityWrapper.appendChild(humidityLabel);

        const humidityBarContainer = document.createElement('div');
        humidityBarContainer.className = 'humidity-bar-container';
        humidityWrapper.appendChild(humidityBarContainer);

        const humidityBarFill = document.createElement('div');
        humidityBarFill.className = 'humidity-bar-fill';
        humidityBarContainer.appendChild(humidityBarFill);

        const valueDisplayHum = document.createElement('div');
        valueDisplayHum.className = 'humidity-value';
        humidityWrapper.appendChild(valueDisplayHum);

        // 更新湿度计显示
        // const humidity = d.humidity;
        const humidity = parseFloat(d.humidity);
        const fillWidthPercent = Math.max(0, Math.min(100, humidity)); // 湿度通常在0-100%
        humidityBarFill.style.width = `${fillWidthPercent}%`;

        // 湿度颜色可以根据高低进行变化，这里简单设为蓝色
        // 如果需要，可以添加类似温度的颜色渐变逻辑
        if (humidity >= 70) {
            humidityBarFill.style.backgroundColor = '#2980B9'; // 较深蓝色
        } else if (humidity >= 40) {
            humidityBarFill.style.backgroundColor = '#3498DB'; // 中等蓝色
        } else {
            humidityBarFill.style.backgroundColor = '#5DADE2'; // 较浅蓝色
        }


        valueDisplayHum.textContent = `${humidity.toFixed(1)}%`;

        // 更新表格
        tbody.insertAdjacentHTML("beforeend",
            `<tr><td>${d.id}</td><td>${d.temperature.toFixed(1)}</td><td>${d.humidity.toFixed(1)}</td></tr>`);
    }
}
refresh(); // 首次加载
setInterval(refresh, 3000); // 3 秒刷新一次
</script>
</body>
</html>
